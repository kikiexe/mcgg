[project]
name = "mcgg-autonomous-agent"
version = "0.1.0"
description = "Multi-provider Autonomous Esports & AI Research Bot for Magic Chess: Go Go (Patch 7.2)"
readme = "PRD.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "litellm>=1.50.0",
    "mss>=9.0.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pydirectinput>=1.0.4",
    "pywin32>=308; sys_platform == 'win32'",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

